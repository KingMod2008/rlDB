<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="controller.css">
</head>
<body>
  <div id="stage" class="br">
    <div id="controller" class="controller xbox">
      <div class="triggers">
        <span id="lt" class="trigger left"></span>
        <span id="rt" class="trigger right"></span>
      </div>
      <div class="bumpers">
        <span id="lb" class="bumper left"></span>
        <span id="rb" class="bumper right"></span>
      </div>
      <div id="touchpad" class="touchpad"></div>
      <div class="quadrant p0"></div>
      <div id="meta" class="meta"></div>
      <div class="arrows">
        <span id="select" class="back"></span>
        <span id="start" class="start"></span>
      </div>
      <div class="abxy">
        <span id="a" class="button a"></span>
        <span id="b" class="button b"></span>
        <span id="x" class="button x"></span>
        <span id="y" class="button y"></span>
      </div>
      <div class="sticks">
        <span id="ls" class="stick left"></span>
        <span id="rs" class="stick right"></span>
      </div>
      <div class="dpad">
        <span id="du" class="face up"></span>
        <span id="dd" class="face down"></span>
        <span id="dl" class="face left"></span>
        <span id="dr" class="face right"></span>
      </div>
    </div>
  </div>
  <script>
    const stage = document.getElementById('stage');
    const controller = document.getElementById('controller');
    const positions = {
      'Top left': ['top', 'left'],
      'Top middle': ['top', 'middle'],
      'Top right': ['top', 'right'],
      'Bottom left': ['bottom', 'left'],
      'Bottom middle': ['bottom', 'middle'],
      'Bottom right': ['bottom', 'right']
    };
    const skins = {
      Xbox: { className: 'xbox', width: 750, height: 630 },
      PlayStation: { className: 'ds4', width: 806, height: 598 }
    };
    let lastMessage = null;

    function value(input, fallback) {
      const parsed = parseFloat(input);
      return isNaN(parsed) ? fallback : parsed;
    }

    function clamp(input, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, input));
    }

    function positionStage(message) {
      const skin = skins[message.controller_type] || skins.Xbox;
      const requestedScale = clamp(value(message.scale, 0.5), 0.25, 1);
      const fitScale = Math.min(window.innerWidth / skin.width, window.innerHeight / skin.height);
      const scale = Math.max(0.01, Math.min(requestedScale, fitScale));
      const renderedWidth = skin.width * scale;
      const renderedHeight = skin.height * scale;
      const maxX = Math.max(0, window.innerWidth - renderedWidth);
      const maxY = Math.max(0, window.innerHeight - renderedHeight);
      const leftX = clamp(value(message.margin_left, 28), 0, maxX);
      const rightX = clamp(maxX - value(message.margin_right, 28), 0, maxX);
      const topY = clamp(value(message.margin_top, 28), 0, maxY);
      const bottomY = clamp(maxY - value(message.margin_bottom, 28), 0, maxY);
      const anchor = positions[message.position] || positions['Bottom right'];
      let x;
      let y;

      if (anchor[1] === 'left') x = leftX;
      else if (anchor[1] === 'right') x = rightX;
      else x = clamp((window.innerWidth - renderedWidth) / 2, Math.min(leftX, rightX), Math.max(leftX, rightX));
      y = anchor[0] === 'top' ? topY : bottomY;

      controller.className = `controller ${skin.className}`;
      stage.className = anchor.join('-');
      stage.style.right = 'auto';
      stage.style.bottom = 'auto';
      stage.style.left = `${x}px`;
      stage.style.top = `${y}px`;
      stage.style.width = `${skin.width}px`;
      stage.style.height = `${skin.height}px`;
      stage.style.transformOrigin = 'top left';
      stage.style.setProperty('--scale', String(scale));
    }

    function pressed(id, isPressed) {
      document.getElementById(id).classList.toggle('pressed', Boolean(isPressed));
    }

    function axis(input) {
      return clamp(value(input, 0), -1, 1);
    }

    window.addEventListener('resize', function () {
      if (lastMessage) positionStage(lastMessage);
    });

    window.addEventListener('message', function (event) {
      const message = event.data || {};
      const pad = message.controller;
      lastMessage = message;
      positionStage(message);
      controller.classList.toggle('hidden', !pad);
      if (!pad) return;

      pressed('a', pad.btn_south);
      pressed('b', pad.btn_east);
      pressed('x', pad.btn_west);
      pressed('y', pad.btn_north);
      pressed('lb', pad.bumper_l);
      pressed('rb', pad.bumper_r);
      pressed('select', pad.select);
      pressed('start', pad.start);
      pressed('touchpad', pad.touchpad);
      pressed('meta', pad.meta);
      pressed('du', pad.dpad_up);
      pressed('dd', pad.dpad_down);
      pressed('dl', pad.dpad_left);
      pressed('dr', pad.dpad_right);
      pressed('ls', pad.stick_l);
      pressed('rs', pad.stick_r);

      document.getElementById('lt').style.opacity = String(Math.max(value(pad.lt, 0), pad.trigger_l ? 1 : 0));
      document.getElementById('rt').style.opacity = String(Math.max(value(pad.rt, 0), pad.trigger_r ? 1 : 0));
      document.getElementById('ls').style.transform = `translate(${axis(pad.lx) * 22}px, ${-axis(pad.ly) * 22}px)`;
      document.getElementById('rs').style.transform = `translate(${axis(pad.rx) * 22}px, ${-axis(pad.ry) * 22}px)`;
    });
  </script>
</body>
</html>
