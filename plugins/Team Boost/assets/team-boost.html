<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { font-family: "Segoe UI", sans-serif; }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: rgba(0, 0, 0, 0) !important;
      pointer-events: none;
      user-select: none;
    }

    #team-boost {
      --accent: #49a9ff;
      --accent-bright: #bce7ff;
      --accent-shadow: rgba(28, 139, 255, 0.55);
      position: fixed;
      top: 50%;
      right: 36px;
      display: flex;
      align-items: center;
      gap: 18px;
      opacity: 0;
      transform: translateY(-50%) scale(1);
      transform-origin: right center;
      transition: opacity 140ms ease;
    }

    #team-boost.visible { opacity: 1; }

    #team-boost.orange {
      --accent: #ff8b32;
      --accent-bright: #ffe0a8;
      --accent-shadow: rgba(255, 112, 22, 0.58);
    }

    .player {
      display: grid;
      grid-template-columns: 24px 34px;
      align-items: end;
      column-gap: 8px;
      height: 276px;
      filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.65));
    }

    .name {
      height: 238px;
      overflow: hidden;
      color: rgba(247, 250, 255, 0.94);
      font-size: 14px;
      font-weight: 650;
      line-height: 24px;
      letter-spacing: 0.65px;
      text-overflow: ellipsis;
      text-shadow: 0 1px 3px #000, 0 0 8px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .gauge-wrap {
      position: relative;
      width: 34px;
      height: 256px;
      padding: 3px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--accent) 72%, white 28%);
      border-radius: 18px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.08), transparent 38%, rgba(0,0,0,0.22)),
        rgba(5, 10, 18, 0.78);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 0 18px rgba(0, 0, 0, 0.72),
        0 0 13px var(--accent-shadow);
    }

    .gauge-track {
      position: absolute;
      inset: 4px;
      overflow: hidden;
      border-radius: 14px;
      background:
        repeating-linear-gradient(to top, transparent 0 23px, rgba(255,255,255,0.08) 23px 24px),
        rgba(0, 0, 0, 0.34);
    }

    .fill {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 0;
      border-radius: 12px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.42), transparent 32%, rgba(0,0,0,0.18)),
        linear-gradient(to top, var(--accent), var(--accent-bright));
      box-shadow: 0 0 14px var(--accent-shadow), inset 0 1px rgba(255,255,255,0.75);
      transition: height 90ms linear;
    }

    .shine {
      position: absolute;
      top: 9px;
      bottom: 9px;
      left: 8px;
      width: 3px;
      border-radius: 3px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.72), rgba(255,255,255,0.02));
      opacity: 0.55;
    }

    .value {
      position: absolute;
      right: 50%;
      bottom: 11px;
      z-index: 2;
      color: white;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 1px 3px #000, 0 0 5px #000;
      transform: translateX(50%);
    }

    #team-boost.hide-numbers .value { display: none; }
  </style>
</head>
<body>
  <div id="team-boost" aria-hidden="true"></div>
  <script>
    const stage = document.getElementById('team-boost');
    const cards = new Map();

    function number(value, fallback) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function createCard(id) {
      const card = document.createElement('div');
      card.className = 'player';
      card.innerHTML = `
        <div class="name"></div>
        <div class="gauge-wrap">
          <div class="gauge-track"><div class="fill"></div></div>
          <div class="shine"></div>
          <div class="value">0</div>
        </div>`;
      cards.set(id, card);
      return card;
    }

    function render(message) {
      const players = Array.isArray(message.players) ? message.players : [];
      const active = new Set(players.map((player, index) => String(player.id || index)));
      for (const [id, card] of cards) {
        if (!active.has(id)) {
          card.remove();
          cards.delete(id);
        }
      }

      players.forEach((player, index) => {
        const id = String(player.id || index);
        const card = cards.get(id) || createCard(id);
        const boost = Math.round(clamp(number(player.boost, 0), 0, 100));
        card.querySelector('.name').textContent = String(player.name || 'Teammate');
        card.querySelector('.fill').style.height = `${boost}%`;
        card.querySelector('.value').textContent = String(boost);
        stage.appendChild(card);
      });

      const scale = clamp(number(message.scale, 1), 0.5, 1.5);
      const margin = clamp(number(message.right_margin, 36), 0, Math.max(0, window.innerWidth - 40));
      const offset = clamp(number(message.vertical_offset, 0), -window.innerHeight / 2 + 30, window.innerHeight / 2 - 30);
      stage.style.right = `${margin}px`;
      stage.style.top = `calc(50% + ${offset}px)`;
      stage.style.transform = `translateY(-50%) scale(${scale})`;
      stage.classList.toggle('orange', Number(message.team) === 1);
      stage.classList.toggle('hide-numbers', message.show_numbers === false);
      stage.classList.toggle('visible', Boolean(message.visible) && players.length > 0);
      stage.setAttribute('aria-hidden', String(!(message.visible && players.length > 0)));
    }

    window.addEventListener('message', event => render(event.data || {}));
  </script>
</body>
</html>
